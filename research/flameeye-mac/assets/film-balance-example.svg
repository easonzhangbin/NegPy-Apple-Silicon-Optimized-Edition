<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" role="img" aria-labelledby="title desc">
  <title id="title">P32 measured spectral shares / P32 实测光谱份额</title>
  <desc id="desc">In this example, red is 65.6 percent, green is 21.8 percent, and blue is 12.6 percent. The axis is the percentage of summed signal in the three selected bands.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1c3036"/><stop offset="1" stop-color="#151b27"/></linearGradient>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill:#edf6f8 }
      .muted { fill:#b2c4d0 }
      .mono { font-family:ui-monospace, SFMono-Regular, monospace }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="582" rx="22" fill="url(#bg)" stroke="#39535d" stroke-width="2"/>
  <text x="46" y="54" fill="#80e6d5" font-size="17" font-weight="700" letter-spacing="3">FLAMEEYE  /  P32</text>
  <text x="46" y="103" font-size="38" font-weight="700">Spectrum through film base</text>
  <text x="47" y="139" class="muted" font-size="22">透过片基的光谱 · 实测示例</text>
  <rect x="44" y="164" width="1112" height="340" rx="18" fill="#111b25" stroke="#344653"/>
  <g font-size="15" class="muted">
    <circle cx="246" cy="198" r="5" fill="#edf6f8"/><text x="259" y="203">Measured / 实测</text>
  </g>
  <g stroke="#2b3c48" stroke-width="1">
    <path d="M246 218v216m148-216v216m148-216v216m148-216v216m148-216v216m148-216v216"/>
  </g>
  <g stroke="#344653" stroke-width="3"><path d="M246 257h740m-740 72h740m-740 72h740"/></g>
  <g>
    <text x="75" y="253" font-size="19" font-weight="700" style="fill:#ff8e98">Red / 红</text>
    <text x="75" y="275" class="muted" font-size="14">625–720 nm</text>
    <circle cx="731.44" cy="257" r="5.5" fill="#ff8e98"/>
    <text x="1119" y="264" text-anchor="end" class="mono" font-size="23">65.6%</text>
  </g>
  <g>
    <text x="75" y="325" font-size="19" font-weight="700" style="fill:#92e6a2">Green / 绿</text>
    <text x="75" y="347" class="muted" font-size="14">520–624 nm</text>
    <circle cx="407.32" cy="329" r="5.5" fill="#92e6a2"/>
    <text x="1119" y="336" text-anchor="end" class="mono" font-size="23">21.8%</text>
  </g>
  <g>
    <text x="75" y="397" font-size="19" font-weight="700" style="fill:#9dbaff">Blue / 蓝</text>
    <text x="75" y="419" class="muted" font-size="14">425–519 nm</text>
    <circle cx="339.24" cy="401" r="5.5" fill="#9dbaff"/>
    <text x="1119" y="408" text-anchor="end" class="mono" font-size="23">12.6%</text>
  </g>
  <g text-anchor="middle" font-size="15" class="mono">
    <text x="246" y="456">0%</text><text x="394" y="456">20%</text><text x="542" y="456">40%</text>
    <text x="690" y="456">60%</text><text x="838" y="456">80%</text><text x="986" y="456">100%</text>
  </g>
  <text x="616" y="482" text-anchor="middle" class="muted" font-size="16">Share of the summed signal across the three bands / 三波段积分份额</text>
  <text x="46" y="543" class="muted" font-size="17">Save the measured spectrum to reproduce this light. / 保存实测光谱，供下次复现灯光。</text>
</svg>
